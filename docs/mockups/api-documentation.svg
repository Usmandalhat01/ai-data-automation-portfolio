<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#f6f8fa"/><rect x="0" y="0" width="1440" height="88" fill="#1f2937"/><text x="55" y="56" font-family="Arial" font-size="28" font-weight="700" fill="#ffffff">Operations Automation API</text><text x="55" y="122" font-family="Arial" font-size="15" fill="#6b7280">Design preview inspired by the FastAPI Swagger interface</text><rect x="55" y="155" width="1330" height="86" rx="16" fill="#ffffff"/><text x="85" y="195" font-family="Arial" font-size="18" font-weight="700" fill="#111827">REST endpoints</text><text x="85" y="222" font-family="Arial" font-size="14" fill="#6b7280">Create, review, update and delete operational jobs with request validation.</text><g font-family="Arial"><rect x="55" y="275" width="1330" height="92" rx="14" fill="#ecfdf5" stroke="#10b981"/><rect x="78" y="298" width="90" height="46" rx="10" fill="#10b981"/><text x="99" y="327" font-size="15" font-weight="700" fill="#ffffff">GET</text><text x="195" y="315" font-size="18" font-weight="700" fill="#111827">/health</text><text x="195" y="342" font-size="14" fill="#4b5563">Check whether the API is running.</text><rect x="55" y="390" width="1330" height="92" rx="14" fill="#eff6ff" stroke="#2563eb"/><rect x="78" y="413" width="90" height="46" rx="10" fill="#2563eb"/><text x="100" y="442" font-size="15" font-weight="700" fill="#ffffff">GET</text><text x="195" y="430" font-size="18" font-weight="700" fill="#111827">/jobs</text><text x="195" y="457" font-size="14" fill="#4b5563">List jobs and optionally filter by status.</text><rect x="55" y="505" width="1330" height="92" rx="14" fill="#f0fdf4" stroke="#16a34a"/><rect x="78" y="528" width="90" height="46" rx="10" fill="#16a34a"/><text x="92" y="557" font-size="15" font-weight="700" fill="#ffffff">POST</text><text x="195" y="545" font-size="18" font-weight="700" fill="#111827">/jobs</text><text x="195" y="572" font-size="14" fill="#4b5563">Create a new operational job.</text><rect x="55" y="620" width="1330" height="92" rx="14" fill="#fff7ed" stroke="#f97316"/><rect x="78" y="643" width="90" height="46" rx="10" fill="#f97316"/><text x="91" y="672" font-size="15" font-weight="700" fill="#ffffff">PATCH</text><text x="195" y="660" font-size="18" font-weight="700" fill="#111827">/jobs/{job_id}/status</text><text x="195" y="687" font-size="14" fill="#4b5563">Update the status of an existing job.</text><rect x="55" y="735" width="1330" height="92" rx="14" fill="#fef2f2" stroke="#dc2626"/><rect x="78" y="758" width="90" height="46" rx="10" fill="#dc2626"/><text x="89" y="787" font-size="15" font-weight="700" fill="#ffffff">DELETE</text><text x="195" y="775" font-size="18" font-weight="700" fill="#111827">/jobs/{job_id}</text><text x="195" y="802" font-size="14" fill="#4b5563">Remove an operational job.</text></g><text x="1125" y="870" font-family="Arial" font-size="13" fill="#9ca3af">Design preview — not a live screenshot</text></svg>